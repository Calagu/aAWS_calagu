spring.application.name=biblioteca

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/biblioteca
#   MariaDB:    jdbc:mariadb://127.0.0.1:3306/biblioteca
#   PostgreSQL: jdbc:postgresql://127.0.0.1:5432/biblioteca
spring.datasource.username=${BIBLIOTECA_DB_USER:biblioteca_app}
spring.datasource.password=${BIBLIOTECA_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
# Si la BD no esta disponible, fallar en 3 s (-> 503) en vez de esperar 30 s
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=never

# Valores por defecto: se sobrescriben con variables de entorno
# (BIBLIOTECA_ALUMNO, BIBLIOTECA_PRESTAMO_MAXIMO, BIBLIOTECA_PRESTAMO_DIAS)
biblioteca.alumno=sin-asignar
biblioteca.prestamo.maximo=3
biblioteca.prestamo.dias=14
